name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (calculation engine)
        run: npm test
      - name: Rebuild the single-file version
        run: npm run build
      - name: Make sure dist/dosecalc-edu.html is up to date
        run: git diff --exit-code -- dist/dosecalc-edu.html
