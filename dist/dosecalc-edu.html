  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fd6'/%3E%3Cpath d='M32 14 L32 50 M14 32 L50 32 M19 19 L45 45 M45 19 L19 45' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ffb454'/%3E%3C/svg%3E">
  <style>
/* DoseCalc EDU styles. Tokens first; dark mode redefines them. */
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #eef2f8;
  --text: #14202e;
  --muted: #576a80;
  --border: #d8e0eb;
  --primary: #1f5fd6;
  --primary-hover: #1a50b5;
  --primary-ink: #ffffff;
  --primary-soft: #e3ecfd;
  --accent: #d9731a;
  --accent-soft: #fdf0e1;
  --good: #14804f;
  --good-soft: #e1f5ec;
  --bad: #c0392b;
  --bad-soft: #fbe9e6;
  --warn-soft: #fff4d6;
  --warn: #8a5a00;
  --s0: #1f5fd6;
  --s1: #d9731a;
  --s2: #7b57d1;
  --grid: #e3e9f2;
  --shadow: 0 1px 2px rgba(20, 32, 46, .06), 0 6px 20px rgba(20, 32, 46, .06);
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1420; --surface: #151d2c; --surface-2: #1c2639; --text: #e8eef8; --muted: #9bacc2;
    --border: #2a3750; --primary: #5b95ff; --primary-hover: #7aa9ff; --primary-ink: #0b1220; --primary-soft: #1a2a4a;
    --accent: #ffa24d; --accent-soft: #3a2a14; --good: #4fd193; --good-soft: #12301f; --bad: #ff8a7a; --bad-soft: #3a1b18;
    --warn-soft: #3a2f10; --warn: #ffd37a; --s0: #6aa2ff; --s1: #ffa24d; --s2: #b79bff; --grid: #26324a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1420; --surface: #151d2c; --surface-2: #1c2639; --text: #e8eef8; --muted: #9bacc2;
  --border: #2a3750; --primary: #5b95ff; --primary-hover: #7aa9ff; --primary-ink: #0b1220; --primary-soft: #1a2a4a;
  --accent: #ffa24d; --accent-soft: #3a2a14; --good: #4fd193; --good-soft: #12301f; --bad: #ff8a7a; --bad-soft: #3a1b18;
  --warn-soft: #3a2f10; --warn: #ffd37a; --s0: #6aa2ff; --s1: #ffa24d; --s2: #b79bff; --grid: #26324a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.2rem; margin-top: 1.6em; }
h4 { font-size: 1rem; }
p { margin: 0 0 1em; }
a { color: var(--primary); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.spaced { margin-top: 2.5rem; }
.skip { position: absolute; left: -999px; top: 0; background: var(--primary); color: var(--primary-ink); padding: .5rem 1rem; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
#view:focus { outline: none; }

/* Layout */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topbar-in { max-width: 1100px; margin: 0 auto; padding: .6rem 16px; display: flex; align-items: center; gap: 1rem; }
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--text); font-weight: 500; font-size: 1.1rem; white-space: nowrap; }
.brand b { color: var(--primary); }
.nav { display: flex; gap: .25rem; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav a { color: var(--muted); text-decoration: none; padding: .45rem .8rem; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--primary-soft); color: var(--primary); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
#view { max-width: 1100px; margin: 0 auto; padding: 24px 16px 56px; min-height: 70vh; }
.wrap { padding: 1rem; }
.footer { border-top: 1px solid var(--border); text-align: center; padding: 1.2rem 16px; color: var(--muted); font-size: .875rem; }
.footer p { margin: 0; }
@media (max-width: 640px) {
  .topbar-in { flex-wrap: wrap; row-gap: .4rem; }
  .nav { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .nav a { padding: .45rem .55rem; font-size: .92rem; }
  .icon-btn { margin-left: auto; }
}

/* Cards, buttons */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: .6rem 1rem; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn.big { padding: .8rem 1.3rem; font-size: 1.05rem; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: .35rem .8rem; font-size: .875rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.right-aligned { text-align: right; margin-top: 2rem; }

/* Home */
.hero { display: grid; grid-template-columns: 1fr; gap: 1.5rem; align-items: center; padding: 1rem 0 2rem; }
@media (min-width: 860px) { .hero { grid-template-columns: 1fr 260px; } }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; font-weight: 700; color: var(--accent); margin-bottom: .6rem; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
.cta { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
.hero-progress { display: flex; align-items: center; gap: 1rem; }
.ring { width: 76px; height: 76px; flex: none; }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 7; }
.ring-fg { fill: none; stroke: var(--primary); stroke-width: 7; stroke-linecap: round; }
.ring-text { fill: var(--text); font-size: 15px; font-weight: 700; }
.grid3 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid2 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.feature h3 { margin-top: .4rem; }
.f-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 800; }
.path { display: grid; gap: .8rem; }
.lesson-card { display: flex; gap: 1rem; text-decoration: none; color: inherit; align-items: flex-start; transition: transform .12s, border-color .12s; }
.lesson-card:hover, .tool-card:hover { border-color: var(--primary); transform: translateY(-1px); }
.lc-num { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 800; }
.lesson-card.complete .lc-num { background: var(--good); color: #fff; }
.lc-title { font-weight: 700; font-size: 1.05rem; }
.lc-body p { margin: .2rem 0 .5rem; }
.lc-meta { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.lvl { font-size: .75rem; font-weight: 700; padding: .15rem .6rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.lvl-beginner { background: var(--good-soft); color: var(--good); }
.lvl-intermediate { background: var(--primary-soft); color: var(--primary); }
.lvl-advanced { background: var(--accent-soft); color: var(--accent); }
.tool-card { display: block; text-decoration: none; color: inherit; transition: transform .12s, border-color .12s; }
.tool-card p { margin: .3rem 0 0; }
.group { margin-top: 2rem; }
.disclaimer { margin-top: 2.5rem; background: var(--warn-soft); border-color: transparent; color: var(--text); }
section + section { margin-top: 2rem; }

/* Lessons */
.crumbs { font-size: .9rem; color: var(--muted); margin-bottom: .6rem; }
.lesson-head h1 { margin-top: .4rem; }
.goals { margin: 1rem 0 1.5rem; }
.goals ul { margin: .4rem 0 0; padding-left: 1.2rem; }
.prose { max-width: 78ch; }
.prose ul, .prose ol { padding-left: 1.3rem; }
.prose li { margin: .3rem 0; }
.lesson-body .widget { max-width: none; }
.formula { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 10px; padding: .9rem 1.1rem; margin: 1rem 0; font-size: 1.1rem; overflow-x: auto; }
.formula-cap { font-size: .85rem; color: var(--muted); margin-top: .4rem; }
.formula.small { font-size: 1rem; box-shadow: none; border-left-width: 3px; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .25em; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .35em .12em; }
.frac > span:last-child { padding: .12em .35em 0; }
.frac.inline { font-size: .85em; margin: 0; }
.callout { border-radius: 10px; padding: .8rem 1rem; margin: 1rem 0; border: 1px solid var(--border); background: var(--surface); }
.callout-title { font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .2rem; }
.callout.tip { background: var(--primary-soft); border-color: transparent; }
.callout.tip .callout-title { color: var(--primary); }
.callout.example { background: var(--good-soft); border-color: transparent; }
.callout.example .callout-title { color: var(--good); }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout.warn .callout-title { color: var(--warn); }
.symbols { display: grid; gap: .4rem; margin: 1rem 0; }
.symbols > div { display: grid; grid-template-columns: 60px 1fr; gap: .8rem; align-items: baseline; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .8rem; }
.symbols dt { font-weight: 800; color: var(--primary); font-family: var(--mono); }
.symbols dd { margin: 0; }
table.mini { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .95rem; }
table.mini th, table.mini td { text-align: left; padding: .45rem .7rem; border-bottom: 1px solid var(--border); }
table.mini th { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
.keypoints { margin-top: 2rem; border-left: 4px solid var(--accent); }
.keypoints ul { margin: 0; padding-left: 1.2rem; }
.lesson-nav { display: flex; gap: .6rem; justify-content: space-between; flex-wrap: wrap; margin-top: 1.5rem; }
.lesson-nav .btn { flex: 0 1 auto; }

/* Widgets, tools, forms */
.widget { margin: 1.4rem 0; padding: 1rem; border: 1.5px dashed var(--border); border-radius: var(--radius); background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.widget.solo { border: none; padding: 0; background: none; }
.widget-tag { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: .6rem; }
.tool { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .tool { grid-template-columns: 340px 1fr; } .tool-in { position: sticky; top: 76px; } }
.tool-out { min-width: 0; }
.form { display: grid; gap: .9rem; }
.form-heading { margin: .6rem 0 0; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.field label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: .25rem; }
.input-wrap { display: flex; align-items: center; gap: .5rem; }
.field input[type=number], .field select, .answer-row input, .search input {
  width: 100%; font: inherit; padding: .55rem .7rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); min-height: 44px;
}
.field input[type=range] { width: 100%; margin-top: .4rem; accent-color: var(--primary); }
.unit { color: var(--muted); font-size: .875rem; white-space: nowrap; min-width: 3.2em; }
.help { color: var(--muted); font-size: .8rem; margin-top: .2rem; }
.big-result { background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 65%, #7b57d1)); color: var(--primary-ink); border-radius: var(--radius); padding: 1.1rem 1.3rem; box-shadow: var(--shadow); }
.br-label { font-size: .85rem; opacity: .9; font-weight: 600; }
.br-value { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.br-unit { font-size: 1.1rem; font-weight: 600; opacity: .9; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; margin: .8rem 0; }
.chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .6rem .8rem; }
.chip-v { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.chip-l { font-size: .78rem; color: var(--muted); }
.notice { border-radius: 10px; padding: .7rem 1rem; margin: .8rem 0; font-size: .95rem; }
.notice.info { background: var(--primary-soft); }
.notice.warn { background: var(--warn-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.sub { margin: 1.2rem 0 .4rem; }
table.factors { width: 100%; border-collapse: collapse; font-size: .92rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table.factors th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); padding: .45rem .7rem; }
table.factors td { padding: .45rem .7rem; border-top: 1px solid var(--border); }
td.sym { font-family: var(--mono); font-weight: 800; color: var(--primary); }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; white-space: nowrap; }
@media (max-width: 560px) { table.factors td:nth-child(4), table.factors th:nth-child(4) { display: none; } }

/* Step by step */
.work { margin-top: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .4rem 1rem 1rem; }
.work > summary { cursor: pointer; font-weight: 700; padding: .7rem 0; color: var(--primary); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; counter-reset: s; }
.steps > li { border-left: 3px solid var(--primary-soft); padding-left: .9rem; }
.step-title { font-weight: 700; }
.step-formula { font-family: var(--mono); font-size: .88rem; color: var(--muted); margin-top: .15rem; overflow-wrap: anywhere; }
.step-work { font-family: var(--mono); font-size: .9rem; background: var(--surface-2); padding: .4rem .6rem; border-radius: 8px; margin-top: .3rem; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.step-result { font-weight: 800; color: var(--good); margin-top: .25rem; font-variant-numeric: tabular-nums; }
.step-why { margin: .25rem 0 0; font-size: .9rem; color: var(--muted); font-style: italic; }
.worked { border-left: 4px solid var(--good); }
.worked-tag { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--good); }
.worked h3 { margin-top: .2rem; }

/* Charts and diagrams */
.chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem; margin: .8rem 0; touch-action: pan-y; }
.chart, .diagram { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--muted); stroke-width: 1.2; }
.chart .tick { fill: var(--muted); font-size: 11px; }
.chart .axis-label { fill: var(--muted); font-size: 12px; font-weight: 600; }
.chart .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .line.s0 { stroke: var(--s0); } .chart .line.s1 { stroke: var(--s1); } .chart .line.s2 { stroke: var(--s2); }
.chart .line.dashed { stroke-dasharray: 6 5; stroke-width: 2.2; }
.chart .vline { stroke: var(--muted); stroke-dasharray: 3 4; }
.chart .vline-label, .chart .legend { fill: var(--muted); font-size: 11px; }
.chart .drop { stroke: var(--accent); stroke-dasharray: 4 4; stroke-width: 1.5; }
.chart .marker { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.chart .marker-label { fill: var(--text); font-size: 13px; font-weight: 800; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.chart .cross-line { stroke: var(--muted); stroke-width: 1; }
.chart .cross-dot { fill: var(--surface); stroke: var(--text); stroke-width: 2; }
.chart .cross-text { fill: var(--text); font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.diagram .beam { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1.5; }
.diagram .source { fill: var(--accent); }
.diagram .plane { stroke-width: 6; stroke-linecap: round; }
.diagram .plane.p1 { stroke: var(--s0); } .diagram .plane.p2 { stroke: var(--s2); }
.diagram .dim { stroke: var(--muted); stroke-width: 1.2; marker-end: none; }
.diagram .dg-text { fill: var(--text); font-size: 13px; font-weight: 600; }
.diagram .dg-note { fill: var(--muted); font-size: 12px; font-weight: 700; }
.bars { display: grid; gap: .5rem; margin: .8rem 0; }
.bar-row { display: grid; grid-template-columns: 70px 1fr 60px; gap: .6rem; align-items: center; font-size: .9rem; }
.bar-label { font-weight: 700; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: 12px; overflow: hidden; }
.bar-fill { background: var(--primary); height: 100%; border-radius: 999px; transition: width .2s; }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

/* Quiz */
.quiz { margin-top: 1.5rem; }
.quiz h3 { margin-top: 0; }
.q { margin: 1.2rem 0; }
.q-text { margin-bottom: .5rem; }
.opts { display: grid; gap: .5rem; }
.opt { text-align: left; font: inherit; padding: .7rem 1rem; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; min-height: 44px; }
.opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); font-weight: 600; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-fb { margin-top: .5rem; border-radius: 8px; padding: 0; }
.quiz-fb.ok, .quiz-fb.no { padding: .55rem .8rem; }
.quiz-fb.ok { background: var(--good-soft); } .quiz-fb.no { background: var(--bad-soft); }

/* Practice */
.practice-head { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: flex-start; }
.scoreboard { display: flex; gap: .6rem; flex-wrap: wrap; }
.score-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .4rem .8rem; text-align: center; min-width: 76px; }
.score-item b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.score-item span { font-size: .72rem; color: var(--muted); }
.controls { display: grid; gap: 1rem; margin: 1rem 0; }
.ctl-label { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .3rem; }
.pills { display: flex; flex-wrap: wrap; gap: .4rem; }
.pill { font: inherit; font-size: .9rem; font-weight: 600; padding: .4rem .85rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; min-height: 40px; }
.pill small { color: var(--muted); font-weight: 500; }
.pill.active { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.pill.active small { color: inherit; opacity: .85; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }

  </footer>

  <script>
/*
 * DoseCalc EDU - calculation engine
 * ---------------------------------
 * Pure functions with no DOM access, so the same code runs in the browser
 * (window.DoseCalc) and in Node (unit tests).
 *
 * IMPORTANT: the beam data below is GENERIC, ROUNDED teaching data that
 * resembles a 6 MV photon beam. It is NOT measured data for any real machine
 * and must never be used to treat patients.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.DoseCalc = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Teaching beam data (generic 6 MV-like photons)
  // ---------------------------------------------------------------------------
  const DMAX = 1.5; // cm, depth of maximum dose
  const LIMITS = { depthMax: 30, fieldMin: 3, fieldMax: 40, ssdMin: 50, ssdMax: 200 };

  // Percent depth dose, 10x10 cm field, SSD = 100 cm.  [depth cm, PDD %]
  const PDD_TABLE = [
    [0, 35], [0.5, 79], [1, 93], [1.5, 100], [2, 98.4], [3, 94.6], [4, 90.6],
    [5, 86.5], [6, 82.6], [8, 75.0], [10, 67.0], [12, 60.0], [15, 50.8],
    [20, 38.4], [25, 29.1], [30, 22.0],
  ];
  // How much a field size different from 10x10 changes dose at depth.
  // PDD(d, A) = PDD(d, 10x10) * (1 + slope(A) * (d - dmax) / 10)
  const FIELD_SLOPE = [
    [3, -0.048], [4, -0.04], [5, -0.032], [6, -0.025], [8, -0.012], [10, 0],
    [12, 0.01], [15, 0.024], [20, 0.042], [25, 0.054], [30, 0.063], [40, 0.075],
  ];
  // Collimator scatter factor Sc and phantom scatter factor Sp vs equivalent square (cm)
  const SC_TABLE = [
    [3, 0.958], [4, 0.968], [5, 0.975], [6, 0.981], [8, 0.991], [10, 1.0],
    [12, 1.007], [15, 1.016], [20, 1.03], [25, 1.039], [30, 1.045], [40, 1.052],
  ];
  const SP_TABLE = [
    [3, 0.94], [4, 0.955], [5, 0.967], [6, 0.976], [8, 0.989], [10, 1.0],
    [12, 1.008], [15, 1.017], [20, 1.025], [25, 1.031], [30, 1.035], [40, 1.04],
  ];
  const WEDGES = {
    none: { label: 'No wedge', factor: 1.0 },
    15: { label: '15° wedge', factor: 0.93 },
    30: { label: '30° wedge', factor: 0.8 },
    45: { label: '45° wedge', factor: 0.68 },
    60: { label: '60° wedge', factor: 0.55 },
  };
  const TRAYS = {
    none: { label: 'No tray', factor: 1.0 },
    tray: { label: 'Blocking tray', factor: 0.97 },
  };
  const DEFAULT_MACHINE = {
    K: 1.0, // cGy per MU under reference conditions
    calibration: 'SAD', // 'SAD': dmax point is 100 cm from source. 'SSD': skin is 100 cm from source.
    rate: 600, // MU per minute
  };

  // Radioactive sources: half-life in days
  const YEAR = 365.25;
  const ISOTOPES = {
    'Co-60': { name: 'Cobalt-60', halfLifeDays: 5.2714 * YEAR, use: 'External-beam teletherapy units' },
    'Cs-137': { name: 'Caesium-137', halfLifeDays: 30.17 * YEAR, use: 'Older brachytherapy sources' },
    'Ir-192': { name: 'Iridium-192', halfLifeDays: 73.83, use: 'HDR brachytherapy' },
    'I-125': { name: 'Iodine-125', halfLifeDays: 59.4, use: 'Permanent seed implants (e.g. prostate)' },
    'Pd-103': { name: 'Palladium-103', halfLifeDays: 16.99, use: 'Permanent seed implants' },
    'Au-198': { name: 'Gold-198', halfLifeDays: 2.695, use: 'Historic implants' },
    'Ra-226': { name: 'Radium-226', halfLifeDays: 1600 * YEAR, use: 'Historic brachytherapy' },
  };
  const TIME_UNITS_DAYS = { days: 1, weeks: 7, months: YEAR / 12, years: YEAR };
  const CO60_HALF_LIFE_YEARS = 5.2714;

  // ---------------------------------------------------------------------------
  // Small helpers
  // ---------------------------------------------------------------------------
  function interp(table, x, log) {
    const first = table[0];
    const last = table[table.length - 1];
    if (x <= first[0]) return first[1];
    if (x >= last[0]) return last[1];
    let i = 0;
    while (table[i + 1][0] < x) i++;
    const [x0, y0] = table[i];
    const [x1, y1] = table[i + 1];
    const t = (x - x0) / (x1 - x0);
    if (log) return Math.exp(Math.log(y0) + t * (Math.log(y1) - Math.log(y0)));
    return y0 + t * (y1 - y0);
  }

  /** Format a number: at most dp decimals, no trailing zeros. */
  function fmt(x, dp) {
    if (dp === undefined) dp = 2;
    if (typeof x !== 'number' || !isFinite(x)) return '—';
    return String(Number(x.toFixed(dp)));
  }
  /** Format a number with exactly dp decimals. */
  function fix(x, dp) {
    if (typeof x !== 'number' || !isFinite(x)) return '—';
    return x.toFixed(dp);
  }

  // ---------------------------------------------------------------------------
  // Core physics
  // ---------------------------------------------------------------------------
  function equivalentSquare(width, length) {
    return (4 * width * length) / (2 * (width + length)); // 4A/P
  }

  function sc(es) { return interp(SC_TABLE, es); }
  function sp(es) { return interp(SP_TABLE, es); }

  function inverseSquareFactor(d1, d2) { return Math.pow(d1 / d2, 2); }

  function mayneordF(f1, f2, depth, dmax) {
    if (dmax === undefined) dmax = DMAX;
    if (depth <= dmax) return 1;
    return Math.pow((f2 + dmax) / (f2 + depth), 2) * Math.pow((f1 + depth) / (f1 + dmax), 2);
  }

  /** PDD at SSD 100 cm for the 10x10 reference field. */
  function pdd10(depth) {
    if (depth <= DMAX) return interp(PDD_TABLE, depth, false);
    return interp(PDD_TABLE, depth, true);
  }

  function fieldSizeFactor(es, depth) {
    if (depth <= DMAX) return 1;
    return 1 + (interp(FIELD_SLOPE, es) * (depth - DMAX)) / 10;
  }

  /** PDD (%) with the three adjustments shown separately so lessons can explain each one. */
  function pddBreakdown(depth, es, ssd) {
    if (ssd === undefined) ssd = 100;
    const base = pdd10(depth);
    const fs = fieldSizeFactor(es, depth);
    const f = mayneordF(100, ssd, depth, DMAX);
    return { base, fieldFactor: fs, mayneord: f, pdd: Math.min(100, base * fs * f) };
  }
  function pdd(depth, es, ssd) { return pddBreakdown(depth, es, ssd).pdd; }

  /**
   * Tissue-maximum ratio for a field of equivalent square `es` measured AT THE DEPTH of the point.
   * Derived from PDD so the SSD and SAD techniques agree (Khan, Physics of Radiation Therapy):
   *   TMR(d, rd) = PDD(d, skin field)/100 x ((100 + d) / (100 + dmax))^2 x Sp(rdmax) / Sp(rd)
   * where, on an SSD = 100 cm basis, skin field = rd x 100/(100 + d) and rdmax = skin field x (100 + dmax)/100.
   */
  function tmr(depth, es) {
    const skinField = (es * 100) / (100 + depth);
    const fieldAtDmax = (skinField * (100 + DMAX)) / 100;
    const geometry = Math.pow((100 + depth) / (100 + DMAX), 2);
    return (pdd(depth, skinField, 100) / 100) * geometry * (sp(fieldAtDmax) / sp(es));
  }

  // ---------------------------------------------------------------------------
  // Monitor units
  // ---------------------------------------------------------------------------
  function machineOf(input) { return Object.assign({}, DEFAULT_MACHINE, (input && input.machine) || {}); }
  function refDistance(m) { return m.calibration === 'SSD' ? 100 + DMAX : 100; }

  function validate(i, needSSD) {
    const num = (x) => typeof x === 'number' && isFinite(x);
    if (!num(i.dose) || i.dose <= 0) return 'Enter a prescribed dose greater than 0 cGy.';
    if (!num(i.depth) || i.depth < DMAX || i.depth > LIMITS.depthMax)
      return `Depth must be between ${DMAX} cm (dmax) and ${LIMITS.depthMax} cm for this teaching model.`;
    if (!num(i.width) || !num(i.length) || i.width < LIMITS.fieldMin || i.length < LIMITS.fieldMin ||
      i.width > LIMITS.fieldMax || i.length > LIMITS.fieldMax)
      return `Field dimensions must be between ${LIMITS.fieldMin} and ${LIMITS.fieldMax} cm.`;
    if (needSSD && (!num(i.ssd) || i.ssd < LIMITS.ssdMin || i.ssd > LIMITS.ssdMax))
      return `SSD must be between ${LIMITS.ssdMin} and ${LIMITS.ssdMax} cm.`;
    return null;
  }

  function modifiers(i) {
    const wedge = WEDGES[i.wedge || 'none'] || WEDGES.none;
    const tray = TRAYS[i.tray || 'none'] || TRAYS.none;
    return { wedge, tray };
  }

  function summaryPair(mu, perMU, doseDmax, dose, m) {
    return {
      mu, muRounded: Math.round(mu), perMU,
      doseAtDmax: doseDmax,
      hotspotPct: (doseDmax / dose) * 100,
      beamOnMin: mu / m.rate,
    };
  }

  /** Monitor units for a fixed-SSD (SSD technique) single field. */
  function muSSD(input) {
    const err = validate(input, true);
    if (err) return { ok: false, error: err };
    const m = machineOf(input);
    const { dose, depth, width, length, ssd } = input;
    const { wedge, tray } = modifiers(input);

    const area = width * length;
    const perim = 2 * (width + length);
    const es = equivalentSquare(width, length);
    const coll = (es * 100) / ssd;
    const scV = sc(coll);
    const dist = ssd + DMAX;
    const esDmax = (es * dist) / ssd; // the beam keeps diverging below the skin
    const spV = sp(esDmax);
    const pb = pddBreakdown(depth, es, ssd);
    const ref = refDistance(m);
    const isf = Math.pow(ref / dist, 2);
    const wf = wedge.factor;
    const tf = tray.factor;
    const noPDD = m.K * scV * spV * isf * wf * tf; // dose per MU at dmax
    const perMU = noPDD * (pb.pdd / 100);
    const mu = dose / perMU;
    const doseDmax = mu * noPDD;

    const steps = [
      {
        title: '1. Find the equivalent square of the field',
        formula: 'Equivalent square = 4 × Area ÷ Perimeter',
        work: `4 × (${fmt(width)} × ${fmt(length)}) ÷ (2 × (${fmt(width)} + ${fmt(length)})) = ${fmt(4 * area)} ÷ ${fmt(perim)}`,
        result: `${fmt(es, 2)} cm`,
        why: 'Every rectangle is replaced by the square field that scatters radiation the same way. All tables are looked up with this number.',
      },
      {
        title: '2. Collimator scatter factor (Sc)',
        formula: 'Sc = value from table at the collimator field size (the field projected to 100 cm)',
        work: `Collimator field = ${fmt(es, 2)} × 100 ÷ ${fmt(ssd)} = ${fmt(coll, 2)} cm  →  Sc(${fmt(coll, 1)} cm)`,
        result: `Sc = ${fix(scV, 3)}`,
        why: 'A bigger opening lets more scattered radiation escape from the machine head, so more dose per MU.',
      },
      {
        title: '3. Phantom (patient) scatter factor (Sp)',
        formula: 'Sp = value from table at the field size at the depth of dmax',
        work: `Field at dmax = ${fmt(es, 2)} × ${fmt(dist, 1)} ÷ ${fmt(ssd)} = ${fmt(esDmax, 2)} cm  →  Sp(${fmt(esDmax, 1)} cm)`,
        result: `Sp = ${fix(spV, 3)}`,
        why: 'A bigger field puts more tissue in the beam, which scatters extra dose back to the point of interest.',
      },
      {
        title: '4. Percent depth dose (PDD)',
        formula: 'PDD = PDD(10×10, SSD 100) × field-size adjustment × Mayneord F',
        work: `${fmt(pb.base, 1)} × ${fix(pb.fieldFactor, 3)} × ${fix(pb.mayneord, 3)} = ${fmt(pb.pdd, 2)} %`,
        result: `PDD = ${fmt(pb.pdd, 2)} %`,
        why: `At ${fmt(depth)} cm deep, only this percentage of the maximum dose reaches the point. Mayneord F = ${fix(pb.mayneord, 3)} corrects for SSD ≠ 100 cm.`,
      },
      {
        title: '5. Inverse-square factor (ISF)',
        formula: 'ISF = (calibration distance ÷ source-to-dmax distance)²',
        work: `(${fmt(ref, 1)} ÷ (${fmt(ssd)} + ${fmt(DMAX)}))² = (${fmt(ref, 1)} ÷ ${fmt(dist, 1)})²`,
        result: `ISF = ${fix(isf, 4)}`,
        why: 'The machine is calibrated at one distance. If the patient\'s dmax point is farther away, the dose rate drops with the square of the distance.',
      },
      {
        title: '6. Wedge and tray factors',
        formula: 'WF = wedge factor, TF = tray factor',
        work: `${wedge.label}: WF = ${fix(wf, 3)};  ${tray.label}: TF = ${fix(tf, 3)}`,
        result: `WF × TF = ${fix(wf * tf, 3)}`,
        why: 'Wedges and trays absorb some of the beam, so each MU delivers a little less dose.',
      },
      {
        title: '7. Dose delivered per monitor unit at the prescription point',
        formula: 'Dose per MU = K × Sc × Sp × PDD/100 × ISF × WF × TF',
        work: `${fix(m.K, 3)} × ${fix(scV, 3)} × ${fix(spV, 3)} × ${fix(pb.pdd / 100, 4)} × ${fix(isf, 4)} × ${fix(wf, 3)} × ${fix(tf, 3)}`,
        result: `${fix(perMU, 4)} cGy per MU`,
        why: 'K is the machine calibration (cGy per MU in the reference setup). Everything else adjusts it to this patient.',
      },
      {
        title: '8. Monitor units',
        formula: 'MU = Prescribed dose ÷ Dose per MU',
        work: `${fmt(dose)} ÷ ${fix(perMU, 4)} = ${fmt(mu, 2)}`,
        result: `${fmt(mu, 1)} MU  →  deliver ${Math.round(mu)} MU`,
        why: 'Round to the nearest whole MU, which is what the machine delivers.',
      },
    ];

    const factors = [
      { symbol: 'K', name: 'Calibration', value: fix(m.K, 3), note: 'cGy per MU in reference setup' },
      { symbol: 'Sc', name: 'Collimator scatter', value: fix(scV, 3), note: `collimator field ${fmt(coll, 1)} cm` },
      { symbol: 'Sp', name: 'Phantom scatter', value: fix(spV, 3), note: `field ${fmt(esDmax, 1)} cm at dmax` },
      { symbol: 'PDD', name: 'Percent depth dose', value: fmt(pb.pdd, 2) + ' %', note: `depth ${fmt(depth)} cm` },
      { symbol: 'ISF', name: 'Inverse square', value: fix(isf, 4), note: `${fmt(dist, 1)} cm to dmax` },
      { symbol: 'WF', name: 'Wedge', value: fix(wf, 3), note: wedge.label },
      { symbol: 'TF', name: 'Tray', value: fix(tf, 3), note: tray.label },
    ];
    return Object.assign({ ok: true, technique: 'SSD', es, factors, steps }, summaryPair(mu, perMU, doseDmax, dose, m), {
      parts: { scV, spV, pdd: pb.pdd, isf, wf, tf },
    });
  }

  /** Monitor units for an isocentric (SAD) single field, dose prescribed at the isocentre. */
  function muSAD(input) {
    const err = validate(input, false);
    if (err) return { ok: false, error: err };
    const m = machineOf(input);
    const { dose, depth, width, length } = input;
    const { wedge, tray } = modifiers(input);

    const area = width * length;
    const perim = 2 * (width + length);
    const es = equivalentSquare(width, length);
    const scV = sc(es);
    const spV = sp(es);
    const tmrV = tmr(depth, es);
    const calFactor = Math.pow(refDistance(m) / 100, 2);
    const wf = wedge.factor;
    const tf = tray.factor;
    const noTMR = m.K * calFactor * scV * spV * wf * tf;
    const perMU = noTMR * tmrV;
    const mu = dose / perMU;
    const doseDmax = mu * noTMR; // dose at dmax depth on the same ray at the same distance

    const steps = [
      {
        title: '1. Find the equivalent square of the field at the isocentre',
        formula: 'Equivalent square = 4 × Area ÷ Perimeter',
        work: `4 × (${fmt(width)} × ${fmt(length)}) ÷ (2 × (${fmt(width)} + ${fmt(length)})) = ${fmt(4 * area)} ÷ ${fmt(perim)}`,
        result: `${fmt(es, 2)} cm`,
        why: 'In the SAD technique the field size is defined at the isocentre (100 cm), which is where the dose point is.',
      },
      {
        title: '2. Collimator and phantom scatter factors',
        formula: 'Sc and Sp = table values at the equivalent square',
        work: `Sc(${fmt(es, 2)} cm) = ${fix(scV, 3)},  Sp(${fmt(es, 2)} cm) = ${fix(spV, 3)}`,
        result: `Sc × Sp = ${fix(scV * spV, 4)}`,
        why: 'Same idea as the SSD technique: bigger fields give more scatter, so more dose per MU.',
      },
      {
        title: '3. Tissue-maximum ratio (TMR)',
        formula: 'TMR = dose at depth ÷ dose at dmax, with the same distance from the source',
        work: `TMR(depth ${fmt(depth)} cm, ${fmt(es, 2)} cm field)`,
        result: `TMR = ${fix(tmrV, 4)}`,
        why: 'TMR only measures how the beam is attenuated by tissue. Because the distance is fixed, no inverse-square correction is needed.',
      },
      {
        title: '4. Wedge and tray factors',
        formula: 'WF = wedge factor, TF = tray factor',
        work: `${wedge.label}: WF = ${fix(wf, 3)};  ${tray.label}: TF = ${fix(tf, 3)}`,
        result: `WF × TF = ${fix(wf * tf, 3)}`,
        why: 'Accessories absorb some of the beam, so each MU delivers a little less dose.',
      },
    ];
    if (m.calibration === 'SSD') {
      steps.push({
        title: '5. Calibration-distance factor',
        formula: 'Cal. factor = ((100 + dmax) ÷ 100)²',
        work: `((100 + ${fmt(DMAX)}) ÷ 100)² = ${fix(calFactor, 4)}`,
        result: `${fix(calFactor, 4)}`,
        why: 'With an SSD-type calibration the reference point sits 1.5 cm farther from the source than the isocentre, so the dose rate at the isocentre is slightly higher.',
      });
    }
    const n = steps.length;
    steps.push({
      title: `${n + 1}. Dose delivered per monitor unit at the isocentre`,
      formula: 'Dose per MU = K × Sc × Sp × TMR × WF × TF',
      work: `${fix(m.K, 3)} × ${fix(scV, 3)} × ${fix(spV, 3)} × ${fix(tmrV, 4)} × ${fix(wf, 3)} × ${fix(tf, 3)}` +
        (calFactor !== 1 ? ` × ${fix(calFactor, 4)}` : ''),
      result: `${fix(perMU, 4)} cGy per MU`,
      why: 'Everything that changes the dose is multiplied together.',
    });
    steps.push({
      title: `${n + 2}. Monitor units`,
      formula: 'MU = Prescribed dose ÷ Dose per MU',
      work: `${fmt(dose)} ÷ ${fix(perMU, 4)} = ${fmt(mu, 2)}`,
      result: `${fmt(mu, 1)} MU  →  deliver ${Math.round(mu)} MU`,
      why: 'Round to the nearest whole MU.',
    });

    const factors = [
      { symbol: 'K', name: 'Calibration', value: fix(m.K, 3), note: 'cGy per MU in reference setup' },
      { symbol: 'Sc', name: 'Collimator scatter', value: fix(scV, 3), note: `field ${fmt(es, 1)} cm` },
      { symbol: 'Sp', name: 'Phantom scatter', value: fix(spV, 3), note: `field ${fmt(es, 1)} cm` },
      { symbol: 'TMR', name: 'Tissue-max ratio', value: fix(tmrV, 4), note: `depth ${fmt(depth)} cm` },
      { symbol: 'WF', name: 'Wedge', value: fix(wf, 3), note: wedge.label },
      { symbol: 'TF', name: 'Tray', value: fix(tf, 3), note: tray.label },
    ];

    // Cross-check with the equivalent fixed-SSD treatment (SSD = 100 - depth).
    let cross = null;
    const ssdEq = 100 - depth;
    if (ssdEq >= LIMITS.ssdMin) {
      const k = ssdEq / 100;
      const alt = muSSD({ dose, depth, width: width * k, length: length * k, ssd: ssdEq,
        wedge: input.wedge, tray: input.tray, machine: input.machine });
      if (alt.ok) cross = { ssd: ssdEq, mu: alt.mu, diffPct: ((alt.mu - mu) / mu) * 100 };
    }

    return Object.assign({ ok: true, technique: 'SAD', es, factors, steps, cross }, summaryPair(mu, perMU, doseDmax, dose, m), {
      parts: { scV, spV, tmr: tmrV, wf, tf },
    });
  }

  // ---------------------------------------------------------------------------
  // Radiobiology (linear-quadratic model)
  // ---------------------------------------------------------------------------
  function bed(n, d, ab) { return n * d * (1 + d / ab); }
  function eqd2(n, d, ab) { return bed(n, d, ab) / (1 + 2 / ab); }
  /** Dose per fraction in a new schedule of n2 fractions that has the same BED. */
  function equivalentDosePerFraction(bedValue, n2, ab) {
    return (-ab + Math.sqrt(ab * ab + (4 * ab * bedValue) / n2)) / 2;
  }

  // ---------------------------------------------------------------------------
  // Radioactive decay
  // ---------------------------------------------------------------------------
  function remainingFraction(t, halfLife) { return Math.pow(0.5, t / halfLife); }
  function decayConstant(halfLife) { return Math.LN2 / halfLife; }
  function timeToFraction(fraction, halfLife) { return (-Math.log2(fraction)) * halfLife; }

  function co60Time(rateAtReference, elapsedYears, dose) {
    const frac = remainingFraction(elapsedYears, CO60_HALF_LIFE_YEARS);
    const rate = rateAtReference * frac;
    return { fraction: frac, rate, minutes: dose / rate };
  }

  return {
    DMAX, LIMITS, PDD_TABLE, SC_TABLE, SP_TABLE, FIELD_SLOPE, WEDGES, TRAYS, DEFAULT_MACHINE,
    ISOTOPES, TIME_UNITS_DAYS, CO60_HALF_LIFE_YEARS,
    interp, fmt, fix,
    equivalentSquare, sc, sp, inverseSquareFactor, mayneordF,
    pdd10, fieldSizeFactor, pddBreakdown, pdd, tmr,
    muSSD, muSAD,
    bed, eqd2, equivalentDosePerFraction,
    remainingFraction, decayConstant, timeToFraction, co60Time,
  };
});

  <script>
/* DoseCalc EDU - UI helpers: DOM builder, forms, step-by-step renderer, SVG charts, progress storage */
(function () {
  'use strict';
  const DE = (window.DoseEdu = window.DoseEdu || {});
  const C = window.DoseCalc;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // ---------------------------------------------------------------------------
  // DOM builders
  // ---------------------------------------------------------------------------
  function applyAttrs(el, attrs) {
    if (!attrs) return;
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  function append(el, kids) {
    for (const c of kids.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
  }
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    applyAttrs(el, attrs);
    append(el, kids);
    return el;
  }
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS(SVG_NS, tag);
    applyAttrs(el, attrs);
    append(el, kids);
    return el;
  }

  /** Stacked fraction used in formulas, e.g. fr('Dose', 'K × Sc') */
  function fr(num, den) {
    return `<span class="frac"><span>${num}</span><span>${den}</span></span>`;
  }

  // ---------------------------------------------------------------------------
  // Progress storage (localStorage with in-memory fallback)
  // ---------------------------------------------------------------------------
  const KEY = 'dosecaledu:v1';
  let memory = {};
  const store = {
    load() {
      try {
        const raw = window.localStorage.getItem(KEY);
        if (raw) memory = JSON.parse(raw) || {};
      } catch (e) { /* storage unavailable: keep memory only */ }
      return memory;
    },
    save() {
      try { window.localStorage.setItem(KEY, JSON.stringify(memory)); } catch (e) { /* ignore */ }
    },
    get(key, fallback) { return memory[key] === undefined ? fallback : memory[key]; },
    set(key, value) { memory[key] = value; this.save(); },
    reset() { memory = {}; this.save(); },
  };
  store.load();

  // ---------------------------------------------------------------------------
  // Forms
  // ---------------------------------------------------------------------------
  let uid = 0;
  function buildForm(fields, onChange) {
    const values = {};
    const rows = [];
    const form = h('form', { class: 'form', onsubmit: (e) => e.preventDefault(), novalidate: true });

    function visibility() {
      for (const r of rows) r.el.hidden = r.show ? !r.show(values) : false;
    }
    function changed() { visibility(); onChange(); }

    for (const f of fields) {
      if (f.type === 'heading') {
        const el = h('h4', { class: 'form-heading' }, f.label);
        rows.push({ el, show: f.show });
        form.append(el);
        continue;
      }
      const id = 'fld' + ++uid;
      values[f.key] = f.value;
      let control;
      let body;
      if (f.type === 'select') {
        control = h('select', { id }, f.options.map((o) => h('option', { value: o.value }, o.label)));
        control.value = String(f.value);
        control.addEventListener('change', () => {
          values[f.key] = control.value;
          changed();
        });
        values[f.key] = control.value;
        body = [control];
      } else {
        control = h('input', {
          id, type: 'number', value: f.value, min: f.min, max: f.max,
          step: f.step || 'any', inputmode: 'decimal',
        });
        const range = f.slider
          ? h('input', { type: 'range', min: f.min, max: f.max, step: f.step || 'any', value: f.value, 'aria-label': `${f.label} slider` })
          : null;
        control.addEventListener('input', () => {
          const v = parseFloat(control.value);
          values[f.key] = v;
          if (range && isFinite(v)) range.value = v;
          changed();
        });
        if (range) {
          range.addEventListener('input', () => {
            control.value = range.value;
            values[f.key] = parseFloat(range.value);
            changed();
          });
        }
        body = [h('div', { class: 'input-wrap' }, control, f.unit ? h('span', { class: 'unit' }, f.unit) : null), range];
      }
      const el = h('div', { class: 'field' },
        h('label', { for: id }, f.label),
        body,
        f.help ? h('div', { class: 'help' }, f.help) : null);
      rows.push({ el, show: f.show });
      form.append(el);
    }
    visibility();
    return { form, values, update: visibility };
  }

  /**
   * Standard "form on the left, live result on the right" tool.
   * spec: { fields, compute(values) -> result | {error}, render(result, values) -> Node }
   */
  function createTool(root, spec) {
    const out = h('div', { class: 'tool-out', 'aria-live': 'polite' });
    const { form, values } = buildForm(spec.fields, refresh);
    function refresh() {
      let node;
      try {
        const res = spec.compute(values);
        node = res && res.error ? notice('warn', res.error) : spec.render(res, values);
      } catch (e) {
        node = notice('warn', 'Something went wrong with these numbers. Please check each box.');
        console.error(e);
      }
      out.replaceChildren(node);
    }
    root.append(h('div', { class: 'tool' }, h('div', { class: 'tool-in card' }, form), out));
    refresh();
    return { values, refresh };
  }

  function notice(kind, text) {
    return h('div', { class: 'notice ' + kind, role: kind === 'warn' ? 'alert' : null }, text);
  }

  // ---------------------------------------------------------------------------
  // Result building blocks
  // ---------------------------------------------------------------------------
  function bigResult(label, value, unit) {
    return h('div', { class: 'big-result' },
      h('div', { class: 'br-label' }, label),
      h('div', { class: 'br-value' }, value, unit ? h('span', { class: 'br-unit' }, ' ' + unit) : null));
  }
  function chips(items) {
    return h('div', { class: 'chips' }, items.map((i) =>
      h('div', { class: 'chip' }, h('div', { class: 'chip-v' }, i.value), h('div', { class: 'chip-l' }, i.label))));
  }
  function stepsList(steps, open) {
    return h('details', { class: 'work', open: open === false ? null : true },
      h('summary', null, 'Show your work, step by step'),
      h('ol', { class: 'steps' }, steps.map((st) =>
        h('li', null,
          h('div', { class: 'step-title' }, st.title),
          st.formula ? h('div', { class: 'step-formula' }, st.formula) : null,
          st.work ? h('div', { class: 'step-work' }, st.work) : null,
          st.result ? h('div', { class: 'step-result' }, st.result) : null,
          st.why ? h('p', { class: 'step-why' }, st.why) : null))));
  }
  function factorTable(factors) {
    return h('table', { class: 'factors' },
      h('thead', null, h('tr', null, h('th', null, 'Symbol'), h('th', null, 'Factor'), h('th', null, 'Value'), h('th', null, 'Why'))),
      h('tbody', null, factors.map((f) =>
        h('tr', null, h('td', { class: 'sym' }, f.symbol), h('td', null, f.name), h('td', { class: 'num' }, f.value), h('td', { class: 'muted' }, f.note)))));
  }

  // ---------------------------------------------------------------------------
  // SVG line chart with hover read-out
  // ---------------------------------------------------------------------------
  function niceTicks(min, max, count) {
    const span = max - min;
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(Number(v.toFixed(10)));
    return ticks;
  }

  /**
   * o: { width, height, xmin, xmax, ymin, ymax, xlabel, ylabel, label,
   *      series:[{fn|points, cls, name, dashed}], markers:[{x,y,label}], vlines:[{x,label}],
   *      readout(x, y) -> text, xfmt, yfmt }
   */
  function lineChart(o) {
    const W = o.width || 640;
    const H = o.height || 340;
    const m = { l: 58, r: 20, t: 18, b: 48 };
    const iw = W - m.l - m.r;
    const ih = H - m.t - m.b;
    const sx = (x) => m.l + ((x - o.xmin) / (o.xmax - o.xmin)) * iw;
    const sy = (y) => m.t + ih - ((y - o.ymin) / (o.ymax - o.ymin)) * ih;
    const xfmt = o.xfmt || ((v) => C.fmt(v, 2));
    const yfmt = o.yfmt || ((v) => C.fmt(v, 2));

    const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': o.label || 'Chart' });
    for (const y of niceTicks(o.ymin, o.ymax, 5)) {
      svg.append(s('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: sy(y), y2: sy(y) }));
      svg.append(s('text', { class: 'tick', x: m.l - 8, y: sy(y) + 4, 'text-anchor': 'end' }, yfmt(y)));
    }
    for (const x of niceTicks(o.xmin, o.xmax, 7)) {
      svg.append(s('line', { class: 'grid v', x1: sx(x), x2: sx(x), y1: m.t, y2: m.t + ih }));
      svg.append(s('text', { class: 'tick', x: sx(x), y: m.t + ih + 18, 'text-anchor': 'middle' }, xfmt(x)));
    }
    svg.append(s('line', { class: 'axis', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
    svg.append(s('line', { class: 'axis', x1: m.l, x2: m.l, y1: m.t, y2: m.t + ih }));
    if (o.xlabel) svg.append(s('text', { class: 'axis-label', x: m.l + iw / 2, y: H - 8, 'text-anchor': 'middle' }, o.xlabel));
    if (o.ylabel) svg.append(s('text', { class: 'axis-label', transform: `translate(14 ${m.t + ih / 2}) rotate(-90)`, 'text-anchor': 'middle' }, o.ylabel));

    for (const v of o.vlines || []) {
      svg.append(s('line', { class: 'vline', x1: sx(v.x), x2: sx(v.x), y1: m.t, y2: m.t + ih }));
      svg.append(s('text', { class: 'vline-label', x: sx(v.x) + 5, y: m.t + 13 }, v.label));
    }
    const sample = (ser) => {
      if (ser.points) return ser.points;
      const pts = [];
      const n = 160;
      for (let i = 0; i <= n; i++) {
        const x = o.xmin + ((o.xmax - o.xmin) * i) / n;
        pts.push([x, ser.fn(x)]);
      }
      return pts;
    };
    (o.series || []).forEach((ser, i) => {
      const pts = sample(ser).filter((p) => isFinite(p[1]));
      const d = pts.map((p, j) => `${j ? 'L' : 'M'}${sx(p[0]).toFixed(1)} ${sy(Math.max(o.ymin, Math.min(o.ymax, p[1]))).toFixed(1)}`).join(' ');
      svg.append(s('path', { class: `line ${ser.cls || 's' + i}${ser.dashed ? ' dashed' : ''}`, d }));
    });
    for (const mk of o.markers || []) {
      svg.append(s('line', { class: 'drop', x1: sx(mk.x), x2: sx(mk.x), y1: sy(mk.y), y2: m.t + ih }));
      svg.append(s('line', { class: 'drop', x1: m.l, x2: sx(mk.x), y1: sy(mk.y), y2: sy(mk.y) }));
      svg.append(s('circle', { class: 'marker', cx: sx(mk.x), cy: sy(mk.y), r: 6 }));
      if (mk.label) {
        const right = sx(mk.x) < W * 0.62;
        svg.append(s('text', { class: 'marker-label', x: sx(mk.x) + (right ? 12 : -12), y: sy(mk.y) - 10, 'text-anchor': right ? 'start' : 'end' }, mk.label));
      }
    }
    (o.series || []).forEach((ser, i) => {
      if (!ser.name) return;
      const y = m.t + 14 + i * 16;
      const lx = o.legendLeft ? m.l + 14 : W - m.r - 150;
      svg.append(s('line', { class: `line ${ser.cls || 's' + i}${ser.dashed ? ' dashed' : ''}`, x1: lx, x2: lx + 22, y1: y - 4, y2: y - 4 }));
      svg.append(s('text', { class: 'legend', x: lx + 28, y }, ser.name));
    });

    // hover / touch read-out on the first series
    const first = (o.series || [])[0];
    if (first && (first.fn || o.readout)) {
      const cross = s('g', { class: 'cross', visibility: 'hidden' },
        s('line', { class: 'cross-line', y1: m.t, y2: m.t + ih }),
        s('circle', { class: 'cross-dot', r: 4.5 }),
        s('text', { class: 'cross-text' }));
      svg.append(cross);
      const cl = cross.children[0];
      const cd = cross.children[1];
      const ct = cross.children[2];
      const overlay = s('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' });
      const move = (ev) => {
        const r = svg.getBoundingClientRect();
        const px = ((ev.clientX - r.left) / r.width) * W;
        const x = Math.max(o.xmin, Math.min(o.xmax, o.xmin + ((px - m.l) / iw) * (o.xmax - o.xmin)));
        const y = first.fn ? first.fn(x) : NaN;
        if (!isFinite(y)) return;
        cl.setAttribute('x1', sx(x)); cl.setAttribute('x2', sx(x));
        cd.setAttribute('cx', sx(x)); cd.setAttribute('cy', sy(y));
        const right = sx(x) < W * 0.6;
        ct.setAttribute('x', sx(x) + (right ? 10 : -10));
        ct.setAttribute('y', Math.max(m.t + 12, sy(y) - 10));
        ct.setAttribute('text-anchor', right ? 'start' : 'end');
        ct.textContent = o.readout ? o.readout(x, y) : `${xfmt(x)} → ${yfmt(y)}`;
        cross.setAttribute('visibility', 'visible');
      };
      overlay.addEventListener('pointermove', move);
      overlay.addEventListener('pointerdown', move);
      overlay.addEventListener('pointerleave', () => cross.setAttribute('visibility', 'hidden'));
      svg.append(overlay);
    }
    return h('div', { class: 'chart-wrap' }, svg);
  }

  // ---------------------------------------------------------------------------
  // Quiz block (multiple choice with explanations)
  // ---------------------------------------------------------------------------
  function quizBlock(questions, quizKey, onDone) {
    const saved = store.get('quiz', {});
    const wrap = h('div', { class: 'quiz card' }, h('h3', null, 'Check your understanding'));
    const answered = {};
    function report() {
      const n = Object.keys(answered).length;
      if (n === questions.length) {
        const right = Object.values(answered).filter(Boolean).length;
        const all = store.get('quiz', {});
        all[quizKey] = { right, total: questions.length };
        store.set('quiz', all);
        if (onDone) onDone(right, questions.length);
      }
    }
    questions.forEach((q, qi) => {
      const fb = h('div', { class: 'quiz-fb', 'aria-live': 'polite' });
      const opts = h('div', { class: 'opts', role: 'group', 'aria-label': `Question ${qi + 1}` });
      q.options.forEach((text, oi) => {
        const b = h('button', { type: 'button', class: 'opt' }, text);
        b.addEventListener('click', () => {
          if (answered[qi] !== undefined) return;
          const ok = oi === q.answer;
          answered[qi] = ok;
          [...opts.children].forEach((btn, bi) => {
            btn.disabled = true;
            if (bi === q.answer) btn.classList.add('right');
            else if (bi === oi) btn.classList.add('wrong');
          });
          fb.className = 'quiz-fb ' + (ok ? 'ok' : 'no');
          fb.replaceChildren(h('strong', null, ok ? 'Correct. ' : 'Not quite. '), h('span', { html: q.why }));
          report();
        });
        opts.append(b);
      });
      wrap.append(h('div', { class: 'q' }, h('p', { class: 'q-text', html: `<b>${qi + 1}.</b> ${q.q}` }), opts, fb));
    });
    if (saved[quizKey]) wrap.append(h('p', { class: 'muted small' }, `Last score: ${saved[quizKey].right}/${saved[quizKey].total}`));
    return wrap;
  }

  Object.assign(DE, { h, s, fr, store, buildForm, createTool, notice, bigResult, chips, stepsList, factorTable, lineChart, quizBlock });
})();

  <script>
/* DoseCalc EDU - interactive calculators and explainer widgets.
 * Every widget is registered once and used both inside lessons and on the Calculators page. */
(function () {
  'use strict';
  const DE = window.DoseEdu;
  const C = window.DoseCalc;
  const { h, s, createTool, notice, bigResult, chips, stepsList, factorTable, lineChart } = DE;
  const { fmt, fix } = C;

  const widgets = {};
  const order = [];
  function reg(id, title, summary, group, mount) {
    widgets[id] = { id, title, summary, group, mount };
    order.push(id);
  }

  const allNumbers = (v, keys) => keys.every((k) => typeof v[k] === 'number' && isFinite(v[k]));
  const NEED_NUMBERS = { error: 'Please fill in every box with a number.' };
  const mmss = (minutes) => {
    const total = Math.round(minutes * 60);
    return `${Math.floor(total / 60)} min ${String(total % 60).padStart(2, '0')} s`;
  };

  // ===========================================================================
  // 1. Fractionation and units
  // ===========================================================================
  reg('fractionation', 'Fractionation & units', 'Total dose, dose per fraction and number of fractions. Gy and cGy.', 'Basics', (el) => {
    createTool(el, {
      fields: [
        {
          key: 'solve', type: 'select', label: 'What do you want to find?', value: 'total',
          options: [
            { value: 'total', label: 'Total dose' },
            { value: 'perfx', label: 'Dose per fraction' },
            { value: 'n', label: 'Number of fractions' },
          ],
        },
        { key: 'd', label: 'Dose per fraction', value: 2, unit: 'Gy', min: 0.1, max: 30, step: 0.1, show: (v) => v.solve !== 'perfx' },
        { key: 'n', label: 'Number of fractions', value: 30, unit: 'fractions', min: 1, max: 60, step: 1, show: (v) => v.solve !== 'n' },
        { key: 'T', label: 'Total dose', value: 60, unit: 'Gy', min: 0.1, max: 120, step: 0.5, show: (v) => v.solve !== 'total' },
      ],
      compute(v) {
        const need = v.solve === 'total' ? ['d', 'n'] : v.solve === 'perfx' ? ['T', 'n'] : ['T', 'd'];
        if (!allNumbers(v, need) || need.some((k) => v[k] <= 0)) return NEED_NUMBERS;
        if (v.solve === 'total') {
          const T = v.d * v.n;
          return { label: 'Total dose', gy: T, unit: 'Gy', steps: [
            { title: 'Multiply dose per fraction by the number of fractions', formula: 'Total dose = Dose per fraction × Number of fractions', work: `${fmt(v.d)} Gy × ${fmt(v.n)}`, result: `${fmt(T, 2)} Gy` },
            { title: 'Convert to centigray (1 Gy = 100 cGy)', formula: 'cGy = Gy × 100', work: `${fmt(T, 2)} × 100`, result: `${fmt(T * 100, 1)} cGy` },
          ] };
        }
        if (v.solve === 'perfx') {
          const d = v.T / v.n;
          return { label: 'Dose per fraction', gy: d, unit: 'Gy', steps: [
            { title: 'Divide the total dose by the number of fractions', formula: 'Dose per fraction = Total dose ÷ Number of fractions', work: `${fmt(v.T)} Gy ÷ ${fmt(v.n)}`, result: `${fmt(d, 3)} Gy` },
            { title: 'Convert to centigray', formula: 'cGy = Gy × 100', work: `${fmt(d, 3)} × 100`, result: `${fmt(d * 100, 1)} cGy` },
          ] };
        }
        const n = v.T / v.d;
        return { label: 'Number of fractions', plain: n, steps: [
          { title: 'Divide the total dose by the dose per fraction', formula: 'Number of fractions = Total dose ÷ Dose per fraction', work: `${fmt(v.T)} Gy ÷ ${fmt(v.d)} Gy`, result: `${fmt(n, 2)} fractions` },
        ], note: Number.isInteger(Number(n.toFixed(6))) ? null : 'The answer is not a whole number. In practice you would round to a whole number of fractions and adjust the dose per fraction.' };
      },
      render(r) {
        const main = r.plain !== undefined ? bigResult(r.label, fmt(r.plain, 2), 'fractions') : bigResult(r.label, fmt(r.gy, 2), r.unit);
        const extra = r.gy !== undefined ? chips([{ label: 'in Gy', value: fmt(r.gy, 3) }, { label: 'in cGy', value: fmt(r.gy * 100, 1) }]) : null;
        return h('div', null, main, extra, r.note ? notice('info', r.note) : null, stepsList(r.steps));
      },
    });
  });

  // ===========================================================================
  // 2. Depth-dose explorer
  // ===========================================================================
  reg('pdd-explorer', 'Depth-dose explorer', 'Drag depth, field size and SSD and watch the PDD curve respond.', 'Beam physics', (el) => {
    createTool(el, {
      fields: [
        { key: 'depth', label: 'Depth of the point', value: 10, unit: 'cm', min: 0, max: 30, step: 0.5, slider: true },
        { key: 'size', label: 'Field size (square)', value: 10, unit: 'cm × cm', min: 3, max: 40, step: 1, slider: true },
        { key: 'ssd', label: 'SSD (source-to-skin distance)', value: 100, unit: 'cm', min: 60, max: 150, step: 1, slider: true },
        { key: 'rx', label: 'Dose you want at that depth', value: 200, unit: 'cGy', min: 1, max: 1000, step: 10 },
      ],
      compute(v) {
        if (!allNumbers(v, ['depth', 'size', 'ssd', 'rx'])) return NEED_NUMBERS;
        const d = Math.max(0, Math.min(30, v.depth));
        const pb = C.pddBreakdown(d, v.size, v.ssd);
        return { d, pb };
      },
      render(r, v) {
        const { d, pb } = r;
        const atDmax = v.rx / (pb.pdd / 100);
        const chart = lineChart({
          label: 'Percent depth dose versus depth',
          xmin: 0, xmax: 30, ymin: 0, ymax: 110, xlabel: 'Depth in tissue (cm)', ylabel: 'Dose (% of maximum)',
          series: [
            { fn: (x) => C.pddBreakdown(x, v.size, v.ssd).pdd, cls: 's0', name: 'Your settings' },
            { fn: (x) => C.pddBreakdown(x, 10, 100).pdd, cls: 's2', dashed: true, name: '10×10, SSD 100 (reference)' },
          ],
          vlines: [{ x: C.DMAX, label: 'dmax' }],
          markers: [{ x: d, y: pb.pdd, label: `${fmt(pb.pdd, 1)} %` }],
          readout: (x, y) => `${fmt(x, 1)} cm → ${fmt(y, 1)} %`,
          yfmt: (y) => fmt(y, 0),
        });
        const region = d < C.DMAX ? 'This point is in the build-up region: the dose is still rising toward dmax.'
          : d === C.DMAX ? 'This is dmax, the depth of maximum dose (100 %).'
            : `Beyond dmax the beam is weakened as it passes through tissue, so only ${fmt(pb.pdd, 1)} % of the maximum dose arrives here.`;
        return h('div', null,
          bigResult(`PDD at ${fmt(d, 1)} cm`, fmt(pb.pdd, 1), '%'),
          chips([
            { label: `Dose needed at dmax for ${fmt(v.rx)} cGy at depth`, value: fmt(atDmax, 0) + ' cGy' },
            { label: 'Extra dose at dmax vs. prescription', value: '+' + fmt((atDmax / v.rx - 1) * 100, 0) + ' %' },
          ]),
          notice('info', region),
          chart,
          h('p', { class: 'muted small' }, 'Hover or tap the curve to read values. Try making the field larger, or moving the SSD out to 120 cm, and see the curve rise: more scatter and a flatter inverse-square drop both help.'));
      },
    });
  });

  // ===========================================================================
  // 3. Inverse-square law
  // ===========================================================================
  function isqDiagram(d1, d2) {
    const W = 600;
    const X0 = 30;
    const cy = 116;
    const ppu = 440 / Math.max(d1, d2); // the farther plane always sits at x = 470
    const near = Math.min(d1, d2);
    const far = Math.max(d1, d2);
    const hFar = 90;
    const hNear = (hFar * near) / far;
    const hOf = (d) => (hFar * d) / far;
    const svg = s('svg', { viewBox: `0 0 ${W} 268`, class: 'diagram', role: 'img', 'aria-label': `Beam spreading from the source to a plane at ${fmt(d1)} cm and a plane at ${fmt(d2)} cm` });
    svg.append(s('path', { class: 'beam', d: `M${X0} ${cy} L${X0 + ppu * far} ${cy - hFar} L${X0 + ppu * far} ${cy + hFar} Z` }));
    svg.append(s('circle', { class: 'source', cx: X0, cy, r: 7 }));
    svg.append(s('text', { class: 'dg-text', x: X0, y: cy + 28, 'text-anchor': 'middle' }, 'Source'));
    // nearer plane: label on its left; farther plane: label on its right; distance rows are staggered
    const planes = [
      { d: d1, name: 'd₁', cls: 'p1' },
      { d: d2, name: 'd₂', cls: 'p2' },
    ];
    planes.forEach((p) => {
      const x = X0 + ppu * p.d;
      const hh = hOf(p.d);
      const isNear = p.d < far || (d1 === d2 && p.name === 'd₁');
      const row = isNear ? 230 : 252;
      svg.append(s('line', { class: 'plane ' + p.cls, x1: x, x2: x, y1: cy - hh, y2: cy + hh }));
      svg.append(s('line', { class: 'dim', x1: X0, x2: x, y1: row - 14, y2: row - 14 }));
      svg.append(s('line', { class: 'dim', x1: x, x2: x, y1: row - 20, y2: row - 8 }));
      svg.append(s('text', { class: 'dg-text', x: x, y: row + 4, 'text-anchor': 'end' }, `${p.name} = ${fmt(p.d)} cm`));
      svg.append(s('text', { class: 'dg-note', x: isNear ? x - 8 : x + 8, y: cy - hh - 6, 'text-anchor': isNear ? 'end' : 'start' }, `area ${fmt((p.d / d1) ** 2, 2)}×`));
    });
    return h('div', { class: 'chart-wrap' }, svg);
  }

  reg('inverse-square', 'Inverse-square law', 'How dose rate changes when you move closer to or farther from the source.', 'Beam physics', (el) => {
    createTool(el, {
      fields: [
        { key: 'r1', label: 'Dose rate at the first distance', value: 100, unit: 'cGy/min', min: 0.01, step: 1 },
        { key: 'd1', label: 'First distance (from source)', value: 100, unit: 'cm', min: 1, max: 500, step: 1 },
        { key: 'd2', label: 'New distance (from source)', value: 120, unit: 'cm', min: 1, max: 500, step: 1, slider: true },
      ],
      compute(v) {
        if (!allNumbers(v, ['r1', 'd1', 'd2']) || v.r1 <= 0 || v.d1 <= 0 || v.d2 <= 0) return NEED_NUMBERS;
        const f = C.inverseSquareFactor(v.d1, v.d2);
        return { f, r2: v.r1 * f };
      },
      render(r, v) {
        const steps = [
          { title: 'Compare the distances', formula: 'Factor = (d₁ ÷ d₂)²', work: `(${fmt(v.d1)} ÷ ${fmt(v.d2)})² = ${fix(v.d1 / v.d2, 4)}²`, result: `Factor = ${fix(r.f, 4)}`, why: r.f < 1 ? 'Farther away, so the dose rate goes down.' : r.f > 1 ? 'Closer to the source, so the dose rate goes up.' : 'Same distance, so no change.' },
          { title: 'Apply the factor to the dose rate', formula: 'New dose rate = Old dose rate × Factor', work: `${fmt(v.r1)} × ${fix(r.f, 4)}`, result: `${fmt(r.r2, 2)} cGy/min` },
        ];
        return h('div', null,
          bigResult('Dose rate at the new distance', fmt(r.r2, 2), 'cGy/min'),
          chips([{ label: 'Inverse-square factor', value: fix(r.f, 4) }, { label: 'Change', value: (r.f >= 1 ? '+' : '') + fmt((r.f - 1) * 100, 1) + ' %' }]),
          isqDiagram(v.d1, v.d2),
          h('p', { class: 'muted small' }, 'Why squared? The same radiation spreads over an area that grows with the square of the distance. Twice as far means four times the area, so a quarter of the dose rate.'),
          stepsList(steps));
      },
    });
  });

  // ===========================================================================
  // 4. Mayneord F factor
  // ===========================================================================
  reg('mayneord', 'Mayneord F factor', 'Convert a PDD measured at one SSD to a different SSD.', 'Beam physics', (el) => {
    createTool(el, {
      fields: [
        { key: 'p1', label: 'PDD at the original SSD', value: 65, unit: '%', min: 1, max: 100, step: 0.1 },
        { key: 'f1', label: 'Original SSD (f₁)', value: 80, unit: 'cm', min: 40, max: 250, step: 1 },
        { key: 'f2', label: 'New SSD (f₂)', value: 100, unit: 'cm', min: 40, max: 250, step: 1, slider: true },
        { key: 'depth', label: 'Depth', value: 10, unit: 'cm', min: 0.5, max: 40, step: 0.5 },
        { key: 'dmax', label: 'Depth of maximum dose (dmax)', value: 1.5, unit: 'cm', min: 0.5, max: 4, step: 0.1 },
      ],
      compute(v) {
        if (!allNumbers(v, ['p1', 'f1', 'f2', 'depth', 'dmax'])) return NEED_NUMBERS;
        if (v.depth <= v.dmax) return { error: 'The Mayneord F factor only applies deeper than dmax. Choose a depth greater than dmax.' };
        const F = C.mayneordF(v.f1, v.f2, v.depth, v.dmax);
        return { F, p2: v.p1 * F };
      },
      render(r, v) {
        const a = (v.f2 + v.dmax) / (v.f2 + v.depth);
        const b = (v.f1 + v.depth) / (v.f1 + v.dmax);
        const steps = [
          { title: 'Inverse-square part for the NEW SSD', formula: '((f₂ + dmax) ÷ (f₂ + d))²', work: `((${fmt(v.f2)} + ${fmt(v.dmax)}) ÷ (${fmt(v.f2)} + ${fmt(v.depth)}))² = (${fix(a, 4)})²`, result: fix(a * a, 4), why: 'How much the beam weakens from dmax to the point, because of distance alone, at the new SSD.' },
          { title: 'Inverse-square part for the OLD SSD', formula: '((f₁ + d) ÷ (f₁ + dmax))²', work: `((${fmt(v.f1)} + ${fmt(v.depth)}) ÷ (${fmt(v.f1)} + ${fmt(v.dmax)}))² = (${fix(b, 4)})²`, result: fix(b * b, 4), why: 'The same quantity at the old SSD, inverted so that it cancels out of the measured PDD.' },
          { title: 'Multiply to get F', formula: 'F = ((f₂ + dmax) ÷ (f₂ + d))² × ((f₁ + d) ÷ (f₁ + dmax))²', work: `${fix(a * a, 4)} × ${fix(b * b, 4)}`, result: `F = ${fix(r.F, 4)}` },
          { title: 'Correct the PDD', formula: 'New PDD = Old PDD × F', work: `${fmt(v.p1, 2)} × ${fix(r.F, 4)}`, result: `${fmt(r.p2, 2)} %` },
        ];
        return h('div', null,
          bigResult('PDD at the new SSD', fmt(r.p2, 2), '%'),
          chips([{ label: 'Mayneord F', value: fix(r.F, 4) }, { label: 'Change in PDD', value: (r.F >= 1 ? '+' : '') + fmt((r.F - 1) * 100, 1) + ' %' }]),
          r.p2 > 100 ? notice('warn', 'The result is above 100 %, which cannot happen for a real PDD. Check your inputs.') : null,
          notice('info', r.F > 1 ? 'Larger SSD means a flatter inverse-square drop between dmax and the point, so the PDD goes up.' : r.F < 1 ? 'Smaller SSD means a steeper inverse-square drop, so the PDD goes down.' : 'Same SSD, so nothing changes.'),
          stepsList(steps),
          h('p', { class: 'muted small' }, 'Mayneord F is an approximation: it corrects for the inverse-square law only and ignores small changes in scatter. It works best for moderate SSD changes.'));
      },
    });
  });

  // ===========================================================================
  // 5. Field size: equivalent square, Sc, Sp
  // ===========================================================================
  reg('field-size', 'Field size & output factors', 'Equivalent square, collimator scatter (Sc) and phantom scatter (Sp).', 'Beam physics', (el) => {
    createTool(el, {
      fields: [
        { key: 'w', label: 'Field width', value: 10, unit: 'cm', min: 3, max: 40, step: 0.5, slider: true },
        { key: 'l', label: 'Field length', value: 20, unit: 'cm', min: 3, max: 40, step: 0.5, slider: true },
      ],
      compute(v) {
        if (!allNumbers(v, ['w', 'l'])) return NEED_NUMBERS;
        if (v.w < 3 || v.l < 3 || v.w > 40 || v.l > 40) return { error: 'Field dimensions must be between 3 and 40 cm.' };
        const es = C.equivalentSquare(v.w, v.l);
        return { es, sc: C.sc(es), sp: C.sp(es) };
      },
      render(r, v) {
        const scp = r.sc * r.sp;
        const bar = (label, val) => h('div', { class: 'bar-row' },
          h('div', { class: 'bar-label' }, label),
          h('div', { class: 'bar-track' }, h('div', { class: 'bar-fill', style: `width:${Math.max(2, Math.min(100, ((val - 0.9) / 0.2) * 100))}%` })),
          h('div', { class: 'bar-val' }, fix(val, 3)));
        const steps = [
          { title: 'Equivalent square', formula: '4 × Area ÷ Perimeter', work: `4 × (${fmt(v.w)} × ${fmt(v.l)}) ÷ (2 × (${fmt(v.w)} + ${fmt(v.l)}))`, result: `${fmt(r.es, 2)} cm` },
          { title: 'Look up Sc and Sp at this size', formula: 'Tables: Sc(ES), Sp(ES)', work: `Sc = ${fix(r.sc, 3)},  Sp = ${fix(r.sp, 3)}`, result: `Sc × Sp = ${fix(scp, 4)}`, why: 'Both factors are 1.000 for the 10×10 reference field.' },
        ];
        const chart = lineChart({
          label: 'Total output factor versus equivalent square',
          xmin: 3, xmax: 40, ymin: 0.9, ymax: 1.1, xlabel: 'Equivalent square (cm)', ylabel: 'Output factor',
          series: [
            { fn: (x) => C.sc(x) * C.sp(x), cls: 's0', name: 'Sc × Sp' },
            { fn: (x) => C.sc(x), cls: 's1', name: 'Sc (head scatter)', dashed: true },
            { fn: (x) => C.sp(x), cls: 's2', name: 'Sp (patient scatter)', dashed: true },
          ],
          markers: [{ x: r.es, y: scp, label: `${fix(scp, 3)}` }],
          readout: (x, y) => `${fmt(x, 1)} cm → Sc×Sp ${fix(y, 3)}`,
          yfmt: (y) => fix(y, 2),
        });
        return h('div', null,
          bigResult('Equivalent square', fmt(r.es, 2), 'cm'),
          h('div', { class: 'bars' }, bar('Sc', r.sc), bar('Sp', r.sp), bar('Sc × Sp', scp)),
          notice('info', scp < 1
            ? `Each MU delivers ${fmt((1 - scp) * 100, 1)} % LESS dose than in the 10×10 reference field, so you need more MU for the same dose.`
            : scp > 1 ? `Each MU delivers ${fmt((scp - 1) * 100, 1)} % MORE dose than in the 10×10 reference field, so you need fewer MU for the same dose.`
              : 'This is the reference field size, so the output factors are exactly 1.'),
          chart, stepsList(steps));
      },
    });
  });

  // ===========================================================================
  // 6 & 7. Monitor unit calculators
  // ===========================================================================
  function muFields(tech) {
    const f = [
      { key: 'dose', label: 'Prescribed dose at the point', value: 200, unit: 'cGy', min: 1, max: 1000, step: 10, help: '200 cGy = 2 Gy' },
      { key: 'depth', label: 'Depth of the point', value: 8, unit: 'cm', min: 1.5, max: 30, step: 0.5, slider: true },
      { key: 'width', label: tech === 'SSD' ? 'Field width on the skin' : 'Field width at isocentre', value: 10, unit: 'cm', min: 3, max: 40, step: 0.5 },
      { key: 'length', label: tech === 'SSD' ? 'Field length on the skin' : 'Field length at isocentre', value: 12, unit: 'cm', min: 3, max: 40, step: 0.5 },
    ];
    if (tech === 'SSD') f.push({ key: 'ssd', label: 'SSD (source-to-skin distance)', value: 100, unit: 'cm', min: 50, max: 200, step: 1, slider: true });
    f.push(
      { key: 'wedge', type: 'select', label: 'Wedge', value: 'none', options: Object.entries(C.WEDGES).map(([value, w]) => ({ value, label: `${w.label}${w.factor === 1 ? '' : ' (WF ' + fix(w.factor, 2) + ')'}` })) },
      { key: 'tray', type: 'select', label: 'Blocking tray', value: 'none', options: Object.entries(C.TRAYS).map(([value, t]) => ({ value, label: `${t.label}${t.factor === 1 ? '' : ' (TF ' + fix(t.factor, 2) + ')'}` })) },
      { key: 'adv', type: 'select', label: 'Machine settings', value: 'no', options: [{ value: 'no', label: 'Standard: 1.000 cGy/MU, 600 MU/min' }, { value: 'yes', label: 'Customise…' }] },
      { key: 'K', label: 'Calibration K', value: 1, unit: 'cGy/MU', min: 0.5, max: 1.5, step: 0.001, show: (v) => v.adv === 'yes' },
      { key: 'cal', type: 'select', label: 'Calibration geometry', value: 'SAD', show: (v) => v.adv === 'yes',
        options: [{ value: 'SAD', label: 'dmax point is 100 cm from source' }, { value: 'SSD', label: 'Skin surface is 100 cm from source' }] },
      { key: 'rate', label: 'Dose rate setting', value: 600, unit: 'MU/min', min: 50, max: 2400, step: 50, show: (v) => v.adv === 'yes' });
    return f;
  }

  function muInput(v, tech) {
    const keys = ['dose', 'depth', 'width', 'length'].concat(tech === 'SSD' ? ['ssd'] : []);
    const input = { dose: v.dose, depth: v.depth, width: v.width, length: v.length, wedge: v.wedge, tray: v.tray };
    if (tech === 'SSD') input.ssd = v.ssd;
    if (v.adv === 'yes') {
      if (!allNumbers(v, ['K', 'rate']) || v.K <= 0 || v.rate <= 0) return { error: 'Enter a positive calibration and dose rate.' };
      input.machine = { K: v.K, calibration: v.cal, rate: v.rate };
    }
    if (!allNumbers(v, keys)) return { error: NEED_NUMBERS.error };
    return { input };
  }

  function renderMU(r, v, tech) {
    const seconds = r.beamOnMin * 60;
    return h('div', null,
      bigResult('Monitor units to deliver', fmt(r.muRounded, 0), 'MU'),
      chips([
        { label: 'Exact value', value: fmt(r.mu, 2) },
        { label: 'Dose per MU at the point', value: fix(r.perMU, 4) + ' cGy' },
        { label: 'Beam-on time', value: seconds >= 90 ? mmss(r.beamOnMin) : fmt(seconds, 0) + ' s' },
        { label: 'Dose at dmax (hot spot)', value: fmt(r.doseAtDmax, 0) + ' cGy' },
      ]),
      r.hotspotPct > 130 ? notice('info', `With one beam, the tissue at dmax receives ${fmt(r.doseAtDmax, 0)} cGy, which is ${fmt(r.hotspotPct, 0)} % of the prescription. This is why treatments often combine several beams from different angles.`) : null,
      tech === 'SAD' && r.cross ? notice('info', `Cross-check: treating the same patient at a fixed SSD of ${fmt(r.cross.ssd, 1)} cm would need ${fmt(r.cross.mu, 1)} MU, a difference of ${fmt(Math.abs(r.cross.diffPct), 2)} %. The two techniques should agree closely; tiny differences come from rounding in the tables.`) : null,
      h('h4', { class: 'sub' }, 'The ingredients'),
      factorTable(r.factors),
      stepsList(r.steps),
      h('p', { class: 'muted small' }, 'Teaching model with generic 6 MV-like data (dmax = 1.5 cm). Not for clinical use.'));
  }

  reg('mu-ssd', 'Monitor units: SSD technique', 'Fixed source-to-skin distance. Uses PDD and the inverse-square factor.', 'Monitor units', (el) => {
    createTool(el, {
      fields: muFields('SSD'),
      compute(v) {
        const x = muInput(v, 'SSD');
        if (x.error) return x;
        const r = C.muSSD(x.input);
        return r.ok ? r : { error: r.error };
      },
      render: (r, v) => renderMU(r, v, 'SSD'),
    });
  });

  reg('mu-sad', 'Monitor units: SAD (isocentric) technique', 'Isocentre inside the patient. Uses TMR, no inverse-square factor.', 'Monitor units', (el) => {
    createTool(el, {
      fields: muFields('SAD'),
      compute(v) {
        const x = muInput(v, 'SAD');
        if (x.error) return x;
        const r = C.muSAD(x.input);
        return r.ok ? r : { error: r.error };
      },
      render: (r, v) => renderMU(r, v, 'SAD'),
    });
  });

      h('h3', null, title),

      stepsList(result.steps, false));

  reg('worked-ssd', 'Worked example: SSD technique', 'A full calculation, explained one step at a time.', 'Examples', (el) => {
    const r = C.muSSD({ dose: 200, depth: 8, width: 12, length: 15, ssd: 100, tray: 'tray' });
    el.append(workedExample('200 cGy at 8 cm depth, SSD 100 cm',

  reg('worked-sad', 'Worked example: SAD technique', 'A full isocentric calculation with a wedge.', 'Examples', (el) => {
